name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Package (aarch64)
    runs-on: ubuntu-latest
    outputs:
      pkgver: ${{ steps.pkg_info.outputs.pkgver }}
      fullver: ${{ steps.pkg_info.outputs.fullver }}
    container:
      image: archlinux:base-devel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract package version
        id: pkg_info
        run: |
          . ./PKGBUILD
          echo "pkgver=v${_pkgver}" >> "$GITHUB_OUTPUT"
          echo "fullver=${pkgver}-${pkgrel}" >> "$GITHUB_OUTPUT"

      - name: Prepare build environment
        run: |
          pacman -Syu --noconfirm --needed git binutils tar xz zstd sudo
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Build Arch Linux package
        run: |
          # Build with makepkg ignoring host architecture check (-A)
          su builder -c "CARCH=aarch64 makepkg -A --noconfirm --nodeps"

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rstudio-desktop-bin-aarch64
          path: ./*.pkg.tar*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built package
        uses: actions/download-artifact@v4
        with:
          name: rstudio-desktop-bin-aarch64
          path: ./dist

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.pkgver }}
          name: "RStudio Desktop ${{ needs.build.outputs.pkgver }} (aarch64)"
          files: ./dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
